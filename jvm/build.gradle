plugins { id 'java'; id 'application' }

// The player remains Java. Reuse the pinned source roots; do not recreate its
// music model, queues, lyric state machines or widget implementation in C++.
def reference = file('../vendor/MuoniumPlayer-2.5.2')
def legacyLibraries = file('../vendor/MuoniumPlayer-reference/26.3/libs')
def commonRoot = new File(reference, 'muonium-common/src/main/java')
def versionRoot = new File(reference, '26.3/src/main/java')
def upstream25 = new groovy.json.JsonSlurper().parse(file('../tools/upstream25.json'))
def latestPaths = upstream25.java.collect { it.substring(it.indexOf('/src/main/java/') + '/src/main/java/'.length()) }
def latestResources = upstream25.resources.collect { it.substring('muonium-common/src/main/resources/'.length()) }
