    commandLine 'py', '../tools/prepare_jvm_sources.py'
    inputs.dir reference
    inputs.file '../tools/prepare_jvm_sources.py'
    inputs.file '../tools/streaming_mix_overlay.py'
    inputs.file '../tools/cine_schedule_overlay.py'
    inputs.file '../tools/cine_motion_overlay.py'
    inputs.file '../tools/ui_presentation_overlay.py'
    inputs.file '../tools/settings_appearance_overlay.py'
    inputs.file '../tools/voice_broadcast_overlay.py'
    inputs.file '../tools/room_latency_overlay.py'
    inputs.file '../tools/room_voice_overlay.py'
    inputs.file '../tools/source_failure_overlay.py'
    inputs.file '../tools/streaming_formats_overlay.py'
    inputs.file '../tools/youtube_stream_overlay.py'
    inputs.file '../tools/youtube_session_overlay.py'
    inputs.file '../tools/youtube_lyrics_overlay.py'
